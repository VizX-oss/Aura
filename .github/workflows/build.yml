name: Build Aura App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: msbuild Aura/Aura.csproj -t:restore -p:Platform=x64

    - name: Build Aura
      run: msbuild Aura/Aura.csproj /p:Configuration=Release /p:Platform=x64 /v:detailed

